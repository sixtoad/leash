version: 2

project_name: leash

before:
  hooks:
    - go mod download
    - make lsm-generate
    - go generate ./internal/entrypoint/...

builds:
  - id: leash
    main: ./cmd/leash
    binary: leash
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # `leash version --json` reports `commit`, and every other build path (the
    # Makefile `build` target, scripts/release.sh, scripts/install-leash.sh,
    # build/publish-docker.sh) appends a "-dirty" marker when the tree is
    # modified. This path has no marker because it is not reachable from a dirty
    # tree: `goreleaser release` (what .github/workflows/release.yml runs) checks
    # the git state and aborts before building if the checkout is modified. That
    # holds only while that validation runs — if this ever gains `--snapshot` or
    # `--skip=validate`, stamp the marker here, or narrow the claim in
    # docs/DEVELOPMENT.md § Reporting the version at run time.
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: leash
    ids:
      - leash
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz

checksum:
  #name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  #algorithm: sha256
  disable: true

release:
  replace_existing_draft: true
  prerelease: false
